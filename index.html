<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Fin de Año Casa Clau'd</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  margin:0;
  padding:15px;
}
.container{
  max-width:600px;
  margin:auto;
}
h1{
  text-align:center;
  color:#333;
}
.card{
  background:white;
  padding:18px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 2px 8px #ccc;
}
.total{
  text-align:center;
  font-size:32px;
  font-weight:bold;
}
input,select,button{
  width:100%;
  box-sizing:border-box;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#333;
  color:white;
  border:none;
  cursor:pointer;
}
button.eliminar{
  background:#d9534f;
  width:auto;
  padding:7px 10px;
}
table{
  width:100%;
  border-collapse:collapse;
}
th,td{
  padding:8px 4px;
  border-bottom:1px solid #ddd;
  text-align:left;
}
.aviso{
  text-align:center;
  color:#666;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">

<h1>🎉 Grupo Fin de Año Casa Clau'd</h1>

<div class="card">
<h2>💰 Saldo total</h2>
<div class="total" id="saldo">0,00 €</div>
</div>

<div class="card">
<h2>➕ Añadir aportación</h2>

<select id="persona">
<option value="Tere">Tere</option>
<option value="Claudia">Claudia</option>
<option value="Pili">Pili</option>
<option value="Javi">Javi</option>
<option value="Raúl">Raúl</option>
</select>

<input id="cantidad" type="number" step="0.01" placeholder="Cantidad (€)">

<button onclick="añadirAportacion()">Añadir aportación</button>
</div>

<div class="card">
<h2>💸 Añadir gasto</h2>

<input id="concepto" type="text" placeholder="Concepto del gasto">

<input id="gasto" type="number" step="0.01" placeholder="Cantidad (€)">

<button onclick="añadirGasto()">Añadir gasto</button>
</div>

<div class="card">
<h2>👥 Aportaciones</h2>
<table>
<thead>
<tr>
<th>Persona</th>
<th>Total</th>
</tr>
</thead>
<tbody id="resumen"></tbody>
</table>
</div>

<div class="card">
<h2>📋 Movimientos</h2>
<div id="movimientos"></div>
</div>

<div class="card">
<button onclick="borrarTodo()" style="background:#d9534f">
Borrar todos los datos
</button>
<p class="aviso">
Los datos se guardan en este dispositivo.
</p>
</div>

</div>

<script>

let datos = JSON.parse(localStorage.getItem("grupoFinDeAno")) || {
  aportaciones: [],
  gastos: []
};

function guardar(){
  localStorage.setItem("grupoFinDeAno", JSON.stringify(datos));
  actualizar();
}

function añadirAportacion(){

  let persona = document.getElementById("persona").value;
  let cantidad = parseFloat(document.getElementById("cantidad").value);

  if(!cantidad || cantidad <= 0){
    alert("Introduce una cantidad válida.");
    return;
  }

  datos.aportaciones.push({
    persona: persona,
    cantidad: cantidad,
    fecha: new Date().toLocaleString("es-ES")
  });

  document.getElementById("cantidad").value="";

  guardar();
}

function añadirGasto(){

  let concepto = document.getElementById("concepto").value.trim();
  let cantidad = parseFloat(document.getElementById("gasto").value);

  if(!concepto){
    alert("Escribe el concepto del gasto.");
    return;
  }

  if(!cantidad || cantidad <= 0){
    alert("Introduce una cantidad válida.");
    return;
  }

  datos.gastos.push({
    concepto: concepto,
    cantidad: cantidad,
    fecha: new Date().toLocaleString("es-ES")
  });

  document.getElementById("concepto").value="";
  document.getElementById("gasto").value="";

  guardar();
}

function actualizar(){

  let totalAportado = datos.aportaciones.reduce(
    (suma,x)=>suma+x.cantidad,0
  );

  let totalGastado = datos.gastos.reduce(
    (suma,x)=>suma+x.cantidad,0
  );

  let saldo = totalAportado-totalGastado;

  document.getElementById("saldo").textContent =
    saldo.toFixed(2).replace(".",",")+" €";

  let personas=["Tere","Claudia","Pili","Javi","Raúl"];

  let html="";

  personas.forEach(persona=>{

    let total=datos.aportaciones
      .filter(x=>x.persona===persona)
      .reduce((suma,x)=>suma+x.cantidad,0);

    html+=`
      <tr>
        <td>${persona}</td>
        <td>${total.toFixed(2).replace(".",",")} €</td>
      </tr>
    `;
  });

  document.getElementById("resumen").innerHTML=html;

  let movimientos="";

  datos.aportaciones.slice().reverse().forEach((x,i)=>{

    movimientos+=`
      <p>
      ➕ <b>${x.persona}</b> aportó
      ${x.cantidad.toFixed(2)} €
      <br><small>${x.fecha}</small>
      </p>
    `;
  });

  datos.gastos.slice().reverse().forEach(x=>{

    movimientos+=`
      <p>
      ➖ <b>${x.concepto}</b>:
      ${x.cantidad.toFixed(2)} €
      <br><small>${x.fecha}</small>
      </p>
    `;
  });

  if(!movimientos){
    movimientos="<p>No hay movimientos todavía.</p>";
  }

  document.getElementById("movimientos").innerHTML=movimientos;
}

function borrarTodo(){

  if(confirm("¿Seguro que quieres borrar todos los datos?")){

    datos={
      aportaciones:[],
      gastos:[]
    };

    guardar();
  }
}

actualizar();

</script>

</body>
</html>
